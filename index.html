<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Đánh Thẻ</title>
    <!-- Thư viện chính thức của Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1f2125);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            padding: 15px 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.7;
        }
        /* Tùy chỉnh màu sắc từng nút theo ý thích */
        .btn-green-1 { background-color: #28a745; } /* Xanh lá */
        .btn-green-2 { background-color: #20c997; } /* Xanh ngọc */
        .btn-red { background-color: #dc3545; grid-column: span 3; } /* Đỏ toàn hàng */
    </style>
</head>
<body>

    <h3>Chọn thời gian nhắc nhở đánh thẻ</h3>
    <div class="grid-container">
        <button class="btn btn-green-1" onclick="sendData(10)">10 Phút</button>
        <button class="btn btn-green-1" onclick="sendData(20)">20 Phút</button>
        <button class="btn btn-green-1" onclick="sendData(30)">30 Phút</button>
        <button class="btn btn-red" onclick="sendData('dung')">🛑 Dừng nhắc nhở</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mở rộng khung Web App toàn màn hình

        function sendData(value) {
            // Gửi dữ liệu về bot Python qua WebApp data
            tg.sendData(value.toString());
        }
    </script>
</body>
</html>
