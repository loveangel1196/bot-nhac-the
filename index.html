<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Đánh Thẻ</title>
    <!-- SDK Web App chính thức của Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .title {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--tg-theme-hint-color, #7f8c8d);
        }
        /* Hàng trên chia đều 3 cột */
        .grid-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn {
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 16px 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25);
            transition: transform 0.1s ease, filter 0.15s ease;
        }
        .btn:active {
            transform: scale(0.96);
            filter: brightness(0.85);
        }
        /* Nút Xanh lá cây */
        .btn-green {
            background: linear-gradient(180deg, #4caf50 0%, #388e3c 100%);
        }
        /* Nút Đỏ to toàn hàng ở dưới */
        .btn-red {
            background: linear-gradient(180deg, #ef5350 0%, #d32f2f 100%);
            width: 100%;
            padding: 18px;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Vui lòng bấm chọn mốc thời gian đánh thẻ</div>
        
        <!-- Hàng 1: 3 nút Xanh lá -->
        <div class="grid-top">
            <button class="btn btn-green" onclick="sendChoice(10)">10 Phút</button>
            <button class="btn btn-green" onclick="sendChoice(20)">20 Phút</button>
            <button class="btn btn-green" onclick="sendChoice(30)">30 Phút</button>
        </div>

        <!-- Hàng 2: 1 nút Đỏ trải dài -->
        <button class="btn btn-red" onclick="sendChoice('dung')">🛑 Dừng nhắc nhở</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendChoice(val) {
            // Rung phản hồi khi bấm nút trên điện thoại
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            // Gửi dữ liệu về bot Python
            tg.sendData(val.toString());
            tg.close();
        }
    </script>
</body>
</html>
