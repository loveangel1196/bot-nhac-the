<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Đánh Thẻ</title>
    <!-- Thư viện Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .title {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-theme-hint-color, #8e8e93);
        }
        /* Hàng trên chia đều 3 cột nút xanh */
        .grid-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            padding: 18px 6px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, filter 0.15s ease;
        }
        .btn:active {
            transform: scale(0.95);
            filter: brightness(0.85);
        }
        /* Nút Xanh lá cây */
        .btn-green {
            background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
        }
        /* Nút Đỏ to toàn hàng ở dưới */
        .btn-red {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
            width: 100%;
            padding: 18px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Bấm nút để đặt giờ hoặc dừng nhắc nhở:</div>
        
        <!-- Hàng trên: 3 nút Xanh lá -->
        <div class="grid-top">
            <button class="btn btn-green" onclick="sendChoice('10')">10 Phút</button>
            <button class="btn btn-green" onclick="sendChoice('20')">20 Phút</button>
            <button class="btn btn-green" onclick="sendChoice('30')">30 Phút</button>
        </div>

        <!-- Hàng dưới: 1 nút Đỏ to dài -->
        <button class="btn btn-red" onclick="sendChoice('dung')">🛑 Dừng nhắc nhở</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendChoice(val) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            // Gửi dữ liệu về bot Python và đóng cửa sổ Web App
            tg.sendData(val);
            tg.close();
        }
    </script>
</body>
</html>
